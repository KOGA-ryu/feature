[workspace]
members = [
  "crates/feature_core",
  "crates/feature_registry",
  "crates/feature_cli",
  "crates/feature_lab_ui",
  "crates/feature_runner",
  "feature_packs/logic/actor_state",
  "feature_packs/logic/ai_target_state",
  "feature_packs/logic/ai_perception_model",
  "feature_packs/logic/ai_intent_model",
  "feature_packs/logic/ai_interaction_event",
  "feature_packs/logic/ai_interaction_grader",
  "feature_packs/logic/search_index",
  "feature_packs/logic/session_notes",
  "feature_packs/logic/document_history",
  "feature_packs/logic/compatibility_matrix",
  "feature_packs/logic/hit_resolution",
  "feature_packs/logic/spec_generator",
  "feature_packs/logic/spec_selector",
  "feature_packs/logic/prompt_generator",
  "feature_packs/logic/reuse_score",
  "feature_packs/logic/theme_token_generator",
  "feature_packs/logic/validation_pipeline",
  "feature_packs/sim/beat_em_up_plane",
  "feature_packs/sim/duel_arena",
  "feature_packs/sim/layer_escalation",
  "feature_packs/sim/runner_track",
  "feature_packs/sim/crash_recovery",
  "feature_packs/sim/checkpoint_flow",
  "feature_packs/ui/activity_stream",
  "feature_packs/ui/ai_grade_hud",
  "feature_packs/ui/command_palette",
  "feature_packs/ui/health_hud",
  "feature_packs/ui/timer_basic",
  "feature_packs/ui/runbook_panel",
  "feature_packs/ui/quick_capture_inbox",
  "feature_packs/ui/scratchpad",
  "feature_packs/ui/calculator_basic",
  "feature_packs/ui/checklist_single",
  "feature_packs/ui/text_editor_plain",
  "feature_packs/ui/scroll_reader_overlay_v1",
  "feature_packs/ui/session_notes_panel",
  "feature_packs/ui/left_rail",
  "feature_packs/ui/right_inspector",
  "feature_packs/ui/theme_editor",
  "feature_packs/ui/wiki_browser",
  "feature_packs/workflows/feature_build_packet_flow",
  "feature_packs/workflows/packet_archive_index",
  "feature_packs/workflows/packet_archive_reader",
  "feature_packs/workflows/packet_archive_writer",
  "feature_packs/workflows/feature_batch_packet_flow",
  "feature_packs/workflows/feature_wave_packet_flow",
  "feature_packs/workflows/feature_extraction_flow",
  "feature_packs/workflows/lineage_tracker",
  "feature_packs/workflows/review_packet_flow",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
eframe = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
