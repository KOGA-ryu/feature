[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dex-features"
version = "0.1.0"
description = "Standalone feature-library tooling for Dex and Codex."
requires-python = ">=3.11"

[project.scripts]
features = "features_tool.cli:main"

[tool.setuptools.packages.find]
include = ["features_tool*"]
